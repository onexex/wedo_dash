; ---------------------------------------------------------------------------
; Per-directory PHP overrides. Honored by PHP running as CGI/FastCGI/suPHP
; (i.e. the production host, which uses suPHP per .htaccess). Local XAMPP runs
; PHP as an Apache module (mod_php) and does NOT read .user.ini, so local dev
; keeps its normal error visibility — these hardening settings apply on prod.
; ---------------------------------------------------------------------------

; Session cookie hardening — not readable by JavaScript, not sent cross-site.
session.cookie_httponly = 1
session.cookie_samesite = "Lax"

; Do not leak PHP errors / stack traces / DB messages to visitors in production;
; log them instead. (The many die("ERROR… ".$e->getMessage()) call sites and any
; uncaught warnings are covered by this in one place.)
display_errors = Off
log_errors = On
